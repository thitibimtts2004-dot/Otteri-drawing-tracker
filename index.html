<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบติดตามเอกสารงานเขียนแบบ · Otteri</title>
<style>
/* ===== Theme tokens ===== */
:root{
  --bg:#e7f1fd; --surface:#ffffff; --surface-2:#f4f8fe; --border:#dbe6f3;
  --text:#1a2234; --muted:#6b7794; --primary:#2f6bff; --primary-ink:#ffffff;
  --primary-soft:#e8f0ff; --accent:#00b894; --warn:#f0a500; --danger:#e5484d;
  --shadow:0 2px 8px rgba(20,35,70,.06), 0 8px 24px rgba(20,35,70,.06);
  --radius:16px; --radius-sm:10px;
  --s1:#8a94a6;--s2:#6c7ae0;--s3:#00b894;--s4:#2f6bff;--s5:#9b59b6;--s6:#e67e22;--s7:#f0a500;--s8:#16a34a;
}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#171f2e; --surface-2:#1e2838; --border:#2a3547;
  --text:#e7ecf5; --muted:#92a0ba; --primary:#5b8cff; --primary-ink:#0e1420;
  --primary-soft:#1b2740; --accent:#2dd4a7; --warn:#f0b429; --danger:#ff6b6f;
  --shadow:0 2px 8px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#171f2e; --surface-2:#1e2838; --border:#2a3547;
  --text:#e7ecf5; --muted:#92a0ba; --primary:#5b8cff; --primary-ink:#0e1420;
  --primary-soft:#1b2740; --accent:#2dd4a7; --warn:#f0b429; --danger:#ff6b6f;
  --shadow:0 2px 8px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none !important}

/* ===== Lock screen ===== */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2f6bff 0%,#5b8cff 50%,#9b59b6 100%);padding:20px}
.lock-card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);
  padding:40px 32px;width:100%;max-width:380px;text-align:center}
.lock-logo{width:64px;height:64px;border-radius:18px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px}
.lock-card h1{font-size:20px;margin-bottom:4px}
.lock-card p{color:var(--muted);font-size:14px;margin-bottom:24px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:24px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:.15s}
.pin-dot.filled{background:var(--primary);transform:scale(1.1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pin-key{height:60px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:600;
  border:1px solid var(--border);transition:.1s}
.pin-key:active{transform:scale(.95);background:var(--primary-soft)}
.pin-key.wide{font-size:16px}
.lock-msg{min-height:20px;margin-top:14px;font-size:13px;color:var(--danger)}
.lock-hint{margin-top:16px;font-size:12px;color:var(--muted)}

/* ===== App shell ===== */
#app{max-width:1280px;margin:0 auto;padding:0 16px 90px}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 0 10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.94)}
.settings-float{margin:14px 0 2px auto;width:38px;height:38px;font-size:17px}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:8px 0 18px}
.stat{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--dot,var(--primary));border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .12s,background .12s}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.stat.active{background:var(--dot,var(--primary));border-color:var(--dot,var(--primary))}
.stat.active .n,.stat.active .l{color:#fff}
.stat.active .l::before{background:#fff}
.stat .n{font-size:26px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.stat .l::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--dot,var(--primary))}

/* toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:0 14px;box-shadow:var(--shadow)}
.search input{border:none;background:none;outline:none;color:var(--text);width:100%;height:44px}
.select{background:var(--surface);border:1px solid var(--border);border-radius:12px;height:46px;
  padding:0 12px;color:var(--text);box-shadow:var(--shadow);outline:none}
.btn{height:46px;padding:0 18px;border-radius:12px;background:var(--primary);color:var(--primary-ink);
  font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.sm{height:38px;padding:0 14px;font-size:14px}
.btn.danger{background:var(--danger);color:#fff}
.btn.accent{background:var(--accent);color:#fff}

/* job cards */
.jobs{display:grid;gap:14px}
.job{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);transition:.15s}
.job:hover{transform:translateY(-2px)}
.job-top{display:flex;align-items:flex-start;gap:12px}
.job-top .code{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.job-top h3{font-size:17px;margin-top:2px}
.job-top .owner{font-size:13px;color:var(--muted);margin-top:3px}
.badge{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;color:#fff}
.job-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.job-meta b{color:var(--text);font-weight:600}
.progress{height:7px;border-radius:999px;background:var(--surface-2);margin-top:14px;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}
.job-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* kanban board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:12px 11px;min-width:232px}
.col-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:12px;padding:0 2px}
.col-head .dot{width:10px;height:10px;border-radius:50%;flex:none}
.col-head .cnt{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--muted);font-weight:600}
.bcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c,var(--primary));border-radius:12px;padding:12px;margin-bottom:10px}
.bcard .bno{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.bcard .bname{font-size:15px;font-weight:700;margin:2px 0 5px;line-height:1.35}
.bcard .bdate{font-size:12px;color:var(--muted);margin-bottom:10px}
.bcard .stsel{width:100%;height:40px;margin-bottom:8px;font-size:13px}
.bcard .doc-btn{width:100%;justify-content:center}
/* status dropdown = colour per status (set inline) · doc button = grey (both views) */
.stsel{color:#fff!important;font-weight:600}
.stsel option{color:var(--text);background:var(--surface)}
.doc-btn{background:var(--doc-grey,#64748b)!important;color:#fff!important;border:1px solid #64748b!important}
.doc-btn:hover{background:#556076!important}
.bcard{position:relative}
.bcard .bno,.bcard .bname{padding-right:60px}
.bcard-acts{position:absolute;top:9px;right:9px;display:flex;gap:4px}
.bcard-acts .iconbtn{width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);cursor:pointer;font-size:13px;line-height:1}
.bcard-acts .iconbtn:hover{background:var(--surface)}
.bcard-acts .iconbtn.del:hover{background:var(--danger);border-color:var(--danger)}
.col:empty-head{display:none}
@media(max-width:640px){.board{grid-auto-flow:row;grid-auto-columns:unset}.col{min-width:0}}
/* view toggle */
.viewtoggle{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.viewtoggle .vt{height:38px;padding:0 14px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}
.viewtoggle .vt.active{background:var(--primary);color:var(--primary-ink)}
/* table view */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.btable{width:100%;border-collapse:collapse;min-width:720px}
.btable th,.btable td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.btable th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap}
.btable tr:last-child td{border-bottom:none}
.btable .t-no{color:var(--muted);font-weight:600;white-space:nowrap}
.btable .t-name{font-weight:700;min-width:180px}
.btable .t-date{color:var(--muted);white-space:nowrap}
.btable .stsel{width:170px;height:38px;margin:0}
.btable .doc-btn{height:38px;padding:0 14px;white-space:nowrap}
.btable .t-acts{display:flex;gap:6px}
.btable .t-acts .iconbtn{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);cursor:pointer;font-size:14px}
.btable .t-acts .iconbtn.del:hover{background:var(--danger);border-color:var(--danger)}

/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(14,20,32,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
@media(min-width:640px){.modal{border-radius:20px}}
.modal-head{position:sticky;top:0;background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;z-index:2}
.modal-head h2{font-size:18px;flex:1}
.modal-body{padding:20px}
.modal-foot{position:sticky;bottom:0;background:var(--surface);padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;color:var(--text);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--surface)}
.field textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* timeline */
.timeline{margin-top:6px}
.tl-step{display:flex;gap:14px;position:relative;padding-bottom:4px}
.tl-step:not(:last-child)::before{content:"";position:absolute;left:15px;top:30px;bottom:-4px;width:2px;background:var(--border)}
.tl-step.done:not(:last-child)::before{background:var(--accent)}
.tl-dot{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:2px solid var(--border);font-size:14px;color:var(--muted);z-index:1}
.tl-step.done .tl-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tl-step.current .tl-dot{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-soft)}
.tl-body{padding-bottom:16px;flex:1}
.tl-body .t{font-weight:600;font-size:15px}
.tl-body .d{font-size:12px;color:var(--muted);margin-top:2px}
.tl-body .note{font-size:13px;margin-top:4px;background:var(--surface-2);border-radius:8px;padding:6px 10px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* tabs inside job */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.fab{position:fixed;right:20px;bottom:22px;z-index:45;height:56px;padding:0 22px;border-radius:999px;
  background:var(--primary);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(47,107,255,.4);
  display:inline-flex;align-items:center;gap:8px}
.fab:active{transform:scale(.96)}

/* ===== Document editor ===== */
.doc-type-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px}
.doc-type{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);
  border-radius:12px;background:var(--surface-2);cursor:pointer;transition:.12s}
.doc-type:hover{border-color:var(--primary)}
.doc-type .ic{font-size:24px}
.doc-type .t{font-weight:600}
.doc-type .s{font-size:12px;color:var(--muted)}
.doc-type .chev{margin-left:auto;color:var(--muted)}
.doc-ready{border-color:var(--accent)}
.doc-ready .chev{color:var(--accent);font-weight:700}

.items-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.items-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border)}
.items-table td{padding:4px}
.items-table input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px}
.items-table td.num input{text-align:right}
.items-table .rm{color:var(--danger);font-size:18px;width:30px;text-align:center}
.tot-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.tot-row.grand{font-size:18px;font-weight:700;border-top:2px solid var(--border);margin-top:6px;padding-top:10px}
.tot-row .mut{color:var(--muted)}

/* ===== Printable document ===== */
#printArea{display:none}
.doc-page{background:#fff;color:#000;font-family:"Sarabun","TH Sarabun New","Segoe UI",sans-serif}
.doc-page .dp-inner{padding:18mm 16mm}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.doc-head .co .nm{font-size:19px;font-weight:700}
.doc-head .co .ad{font-size:13px;color:#333;margin-top:3px;white-space:pre-line;max-width:320px}
.doc-title-box{text-align:right}
.doc-title-box .tt{font-size:22px;font-weight:700}
.doc-title-box .cp{font-size:13px;color:#b00;font-weight:600;margin-top:2px}
.doc-no{font-size:13px;color:#222;margin-top:6px}
.doc-cust{display:flex;justify-content:space-between;gap:16px;margin-top:18px;border:1px solid #ccc;border-radius:6px;padding:12px}
.doc-cust .lbl{font-size:12px;color:#666}
.doc-cust .val{font-size:14px;font-weight:600}
table.dp-items{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
table.dp-items th{background:#f0f3f8;border:1px solid #bcc6d6;padding:8px 6px;font-size:13px}
table.dp-items td{border:1px solid #cdd6e4;padding:7px 6px;vertical-align:top}
table.dp-items td.c{text-align:center}table.dp-items td.r{text-align:right}
.dp-foot{display:flex;justify-content:space-between;gap:20px;margin-top:10px}
.dp-baht{flex:1;border:1px solid #cdd6e4;border-radius:6px;padding:10px 12px;font-size:14px;align-self:flex-start}
.dp-baht .lbl{font-size:11px;color:#666}
.dp-tot{width:260px;font-size:14px}
.dp-tot .row{display:flex;justify-content:space-between;padding:3px 0}
.dp-tot .grand{border-top:2px solid #333;margin-top:4px;padding-top:7px;font-size:17px;font-weight:700}
.dp-sign{display:flex;justify-content:space-between;margin-top:40px;gap:20px}
.dp-sign .box{flex:1;text-align:center}
.dp-sign .line{border-top:1px dotted #555;margin:40px 16px 6px}
.dp-sign .cap{font-size:13px;color:#333}
.dp-note{font-size:12px;color:#444;margin-top:14px;white-space:pre-line}

@media print{
  @page{size:A4;margin:0}
  html,body{margin:0;padding:0;background:#fff}
  body>*:not(#printArea){display:none !important}
  #printArea{display:block}
  .doc-page{box-sizing:border-box;width:210mm;min-height:296mm;overflow:hidden;page-break-after:always}
  .doc-page:last-child{page-break-after:auto}
}
</style>
</head>
<body>

<!-- ===== LOCK SCREEN ===== -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-logo">🔒</div>
    <h1 id="lockTitle">ใส่รหัส PIN</h1>
    <p id="lockSub">ระบบติดตามเอกสารงานเขียนแบบ</p>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-pad" id="pinPad"></div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="lock-hint" id="lockHint"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <button class="icon-btn settings-float" id="settingsBtn" title="ตั้งค่า">⚙️</button>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search">🔍<input id="searchInput" placeholder="ค้นหาสาขา..."></div>
    <div class="viewtoggle">
      <button class="vt active" id="viewBoard">▦ บอร์ด</button>
      <button class="vt" id="viewTable">☰ ตาราง</button>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="tablewrap hidden" id="tablewrap"></div>
</div>

<button class="fab hidden" id="fab">＋ เพิ่มสาขา</button>
<div id="toast"></div>

<script>
"use strict";
/* ===================================================================
   Otteri Drawing Document Tracker — single-file app
   S1: shell · PIN lock · job CRUD · 8-stage pipeline · dashboard
       · settings · export/import · theme
   =================================================================== */

// ---- 8-stage pipeline (user spec 7.1–7.9) ----
const STAGES = [
  {n:1, label:"รับแบบร่างจาก Owner",       short:"รับแบบร่าง",   color:"var(--s1)"},
  {n:2, label:"เขียนแบบก่อสร้าง & ส่งกลับ", short:"เขียนแบบ",     color:"var(--s2)"},
  {n:3, label:"Owner อนุมัติแบบ",          short:"อนุมัติแบบ",   color:"var(--s3)"},
  {n:4, label:"ส่งใบเสนอราคา",             short:"เสนอราคา",     color:"var(--s4)"},
  {n:5, label:"Owner ออก PO",             short:"ออก PO",       color:"var(--s5)"},
  {n:6, label:"เซ็น PO + วางบิล (ต้นฉบับ+สำเนา)", short:"วางบิล", color:"var(--s6)"},

// ---- delay threshold: a job sitting in one stage longer than this is "ล่าช้า" ----
const DELAY_DAYS = 7;
const DAY_MS = 86400000;
function daysBetween(a,b){ return Math.floor((b-a)/DAY_MS); }
function currentStageSince(j){
  const h=(j.history||[]);
  return h.length ? h[h.length-1].at : (j.createdAt||Date.now());
}
function jobDelay(j){
  if(!j || j.stage>=8) return null;              // stage 8 = ชำระแล้ว, ไม่มีความล่าช้า
  const d = daysBetween(currentStageSince(j), Date.now());
  return { days:d, late:d>=DELAY_DAYS };
}

const LS_KEY = "otteri_tracker_v1";
let state = {
  pinHash: null,
  theme: "auto",
  company: Object.assign({}, DEFAULT_COMPANY),
  counters: { QT:0, BL:0, RC:0 },

// Cloud sync (Firebase Firestore) ----------------------------------------
// SHARED keys live in the central database (everyone sees the same data).
// LOCAL keys are per-device UI preferences (kept only in this browser cache).
const CLOUD_ENABLED = true;
const SHARED_KEYS = ["pinHash","company","counters","extraBranches","seeded","jobs"];
const LOCAL_KEYS  = ["theme","view","filter"];
let cloudReady = false;   // first snapshot (or offline fallback) has arrived
let appUnlocked = false;  // PIN passed, app visible

function sharedState(){
  const o = {};
  SHARED_KEYS.forEach(k => { o[k] = state[k] === undefined ? null : state[k]; });
  return o;
}
function saveLocalCache(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("บันทึกไม่สำเร็จ (พื้นที่เต็ม?)"); }
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ state = Object.assign(state, JSON.parse(raw)); }
  }catch(e){ console.warn("load failed", e); }
}
function save(){
  saveLocalCache();
  if(CLOUD_ENABLED && window.__otteriCloudSave){ window.__otteriCloudSave(sharedState()); }
}

// Called by the Firebase bridge on every snapshot (null = no cloud doc yet).
function applyRemote(remote){
  if(remote){
    SHARED_KEYS.forEach(k => { if(k in remote && remote[k] !== undefined) state[k] = remote[k]; });
  }
  saveLocalCache();
  if(!cloudReady){
    runPinGate();
    // Cloud is empty: push our current (cached/seeded) data up to seed the DB.
    if(!remote && window.__otteriCloudSave){ window.__otteriCloudSave(sharedState()); }
  } else if(appUnlocked){
    render();
  }
}
window.__otteriApplyRemote = applyRemote;

// Decide the PIN screen mode once real (cloud or cached) data is in hand,
// so a brand-new device cannot set a fresh PIN over the shared team one.
function runPinGate(){
  if(cloudReady) return;
  cloudReady = true;
  pinMode = state.pinHash ? "enter" : "setNew";
  setLockUI(); renderPinDots();
}

// ---- tiny hash for PIN (obfuscation, not crypto) ----
function hashPin(pin){
  let h = 5381;
  for(let i=0;i<pin.length;i++){ h = ((h<<5)+h) ^ pin.charCodeAt(i); }
  return "h"+(h>>>0).toString(16);
}

const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtDate(ts){ if(!ts) return "-"; const d=new Date(ts);
  return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

// =====================================================================
// PIN LOCK
// =====================================================================
let pinBuf = "";
let pinMode = "enter"; // enter | setNew | confirmNew
let pinFirst = "";

function renderPinDots(){
  const box=$("#pinDots"); box.innerHTML="";
  for(let i=0;i<4;i++){ const d=el("div","pin-dot"); if(i<pinBuf.length)d.classList.add("filled"); box.appendChild(d); }
}
function buildPinPad(){
  const pad=$("#pinPad"); pad.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(k=>{
    const b=el("button","pin-key"+(k.length>1?" wide":""),k);
    b.onclick=()=>pinPress(k);
    pad.appendChild(b);
  });
}
function pinPress(k){
  $("#lockMsg").textContent="";
  if(k==="⌫"){ pinBuf=pinBuf.slice(0,-1); renderPinDots(); return; }
  if(k==="✓"){ pinSubmit(); return; }
  if(pinBuf.length<4){ pinBuf+=k; renderPinDots(); if(pinBuf.length===4) setTimeout(pinSubmit,150); }
}
function setLockUI(){
  const noPin = !state.pinHash;
  if(noPin && pinMode==="enter"){ pinMode="setNew"; }
  const titles={enter:"ใส่รหัส PIN", setNew:"ตั้งรหัส PIN ใหม่", confirmNew:"ยืนยันรหัส PIN"};
  $("#lockTitle").textContent=titles[pinMode];
  $("#lockHint").textContent = pinMode==="enter" ? "" : "ตั้งรหัส 4 หลัก (ใช้ร่วมกันทั้งทีม)";
}
function pinSubmit(){
  if(pinBuf.length<4){ $("#lockMsg").textContent="กรุณาใส่ครบ 4 หลัก"; return; }
  if(pinMode==="setNew"){ pinFirst=pinBuf; pinBuf=""; pinMode="confirmNew"; setLockUI(); renderPinDots(); return; }
  if(pinMode==="confirmNew"){
    if(pinBuf!==pinFirst){ $("#lockMsg").textContent="รหัสไม่ตรงกัน ลองใหม่"; pinBuf=""; pinMode="setNew"; pinFirst=""; setLockUI(); renderPinDots(); return; }
    state.pinHash=hashPin(pinBuf); save(); unlock(); return;
  }
  // enter
  if(hashPin(pinBuf)===state.pinHash){ unlock(); }
  else{ $("#lockMsg").textContent="รหัสไม่ถูกต้อง"; pinBuf=""; renderPinDots(); }
}
function unlock(){
  appUnlocked = true;
  pinBuf=""; $("#lock").classList.add("hidden");
  $("#app").classList.remove("hidden"); $("#fab").classList.remove("hidden");
  render();
}
function lock(){
  appUnlocked = false;
  pinBuf=""; pinMode = state.pinHash ? "enter" : "setNew"; pinFirst="";
  $("#app").classList.add("hidden"); $("#fab").classList.add("hidden");
  $("#lock").classList.remove("hidden"); setLockUI(); renderPinDots();
}

function applyTheme(){
  const t=state.theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  const tb=$("#themeBtn"); if(tb) tb.textContent = t==="dark" ? "☀️" : t==="light" ? "🌙" : "🌓";
}
function cycleTheme(){
  state.theme = state.theme==="auto" ? "light" : state.theme==="light" ? "dark" : "auto";
  save(); applyTheme(); toast("ธีม: "+({auto:"อัตโนมัติ",light:"สว่าง",dark:"มืด"}[state.theme]));
}

function render(){
  syncBranchJobs();
  renderStats(); renderView();
}
function renderView(){
  const board=$("#board"), tw=$("#tablewrap"), vb=$("#viewBoard"), vt=$("#viewTable");
  if(state.view==="table"){
    board.classList.add("hidden"); tw.classList.remove("hidden");
    vt.classList.add("active"); vb.classList.remove("active");
    renderTable();
  }else{
    tw.classList.add("hidden"); board.classList.remove("hidden");
    vb.classList.add("active"); vt.classList.remove("active");
    renderBoard();
  }
}
function filteredJobs(){
  const q=($("#searchInput").value||"").toLowerCase().trim();
  let jobs=state.jobs.slice();
  if(state.filter) jobs=jobs.filter(j=>jStatus(j)===state.filter);
  if(q) jobs=jobs.filter(j=>String(j.location||"").toLowerCase().includes(q));
  jobs.sort((a,b)=>branchNo(a.location).localeCompare(branchNo(b.location),undefined,{numeric:true}));
  return jobs;
}
function statusSelect(j){
  const sel=el("select","select stsel");
  STATUSES.forEach(st=>{ const o=el("option",null,st.label); o.value=st.k; if(st.k===jStatus(j))o.selected=true; sel.appendChild(o); });
  const c=statusByK(jStatus(j)).color;
  sel.style.background=c; sel.style.border="1px solid "+c;
  sel.onchange=()=>{ j.status=sel.value; save(); render(); };
  return sel;
}
// ensure state.jobs == exactly the 38 branches (merge prior data by branch name, drop strays)
function syncBranchJobs(){
  // Seed the fixed 38 branches ONCE. After seeding, state.jobs is fully owned
  // by the user — edit/delete on a card persists and never gets overwritten
  // or re-created by a resync (that was the old rebuild-every-render behavior).
  const have=new Set(state.jobs.map(j=>branchName(j.location)));
  let changed=false;
  if(!state.seeded){
    BRANCHES.forEach(b=>{
      const k=branchName(b);
      if(k && !have.has(k)){ state.jobs.push(branchJob(b)); have.add(k); changed=true; }
    });
    state.seeded=true; changed=true;
  }
  if(changed) save();
}
function branchJob(b){
  return { id:uid(), code:"", title:"เขียนแบบก่อสร้าง สาขา "+branchName(b),
    owner:"", location:b, value:String(QT_UNIT_PRICE),
    note:"", status:"design", createdAt:Date.now(), opDate:Date.now(), docs:{} };
}
function renderStats(){
  const box=$("#stats"); box.innerHTML="";
  const cards=[[null,"ทั้งหมด", state.jobs.length, "var(--primary)"]];
  STATUSES.forEach(s=>cards.push([s.k, s.label, state.jobs.filter(j=>jStatus(j)===s.k).length, s.color]));
  cards.forEach(([k,l,n,c])=>{
    const s=el("div","stat"+(state.filter===k?" active":"")); s.style.setProperty("--dot",c);
    s.appendChild(el("div","n",n)); s.appendChild(el("div","l",l));
    s.title = k ? "กดเพื่อดูเฉพาะ "+l : "กดเพื่อดูทั้งหมด";
    s.onclick=()=>{ state.filter = (state.filter===k ? null : k); save(); render(); };
    box.appendChild(s);
  });
}
function renderBoard(){
  const board=$("#board"); board.innerHTML="";
  const q=($("#searchInput").value||"").toLowerCase().trim();
  STATUSES.forEach(s=>{
    if(state.filter && s.k!==state.filter) return;
    const col=el("div","col");
    let jobs=state.jobs.filter(j=>jStatus(j)===s.k);
    if(q) jobs=jobs.filter(j=>String(j.location||"").toLowerCase().includes(q));
    jobs.sort((a,b)=>branchNo(a.location).localeCompare(branchNo(b.location),undefined,{numeric:true}));
    const head=el("div","col-head");
    const dot=el("span","dot"); dot.style.background=s.color; head.appendChild(dot);
    head.appendChild(el("span",null,s.label));
    head.appendChild(el("span","cnt",jobs.length)); col.appendChild(head);
    jobs.forEach(j=>col.appendChild(branchCard(j)));
    board.appendChild(col);
  });
}
function branchCard(j){
  const s=statusByK(jStatus(j));
  const card=el("div","bcard"); card.style.setProperty("--c",s.color);
  card.appendChild(el("div","bno","สาขา "+(branchNo(j.location)||"—")));
  card.appendChild(el("div","bname", branchName(j.location)||j.title||"(ไม่ระบุ)"));
  card.appendChild(el("div","bdate","🗓 "+fmtDate(j.opDate||j.createdAt)));

  acts.appendChild(editBtn); acts.appendChild(delBtn);

}

function deleteBranch(j){
  const nm=(branchNo(j.location)?"สาขา "+branchNo(j.location)+" ":"")+(branchName(j.location)||"");
  if(!confirm("ลบ "+nm+" ?\nการ์ดงานนี้จะถูกลบถาวร")) return;
  state.jobs=state.jobs.filter(x=>x.id!==j.id);
  const key=branchName(j.location);
  if(state.extraBranches) state.extraBranches=state.extraBranches.filter(b=>branchName(b)!==key);
  save(); render(); toast("ลบ "+nm+" แล้ว");
}

function openJob(id){
  const j=state.jobs.find(x=>x.id===id); if(!j) return;
  const m=modal(j.title||"งาน");

  const bInfo=el("button",null,"รายละเอียด"), bTl=el("button",null,"ไทม์ไลน์"), bDoc=el("button",null,"เอกสาร");
  seg.append(bInfo,bTl,bDoc); m.body.appendChild(seg);
  const pane=el("div"); m.body.appendChild(pane);
  const tabs={info:()=>paneInfo(j),tl:()=>paneTimeline(j),doc:()=>paneDocs(j,m)};
  function show(which,btn){ [bInfo,bTl,bDoc].forEach(b=>b.classList.remove("on")); btn.classList.add("on");
    pane.innerHTML=""; pane.appendChild(tabs[which]()); }
  bInfo.onclick=()=>show("info",bInfo); bTl.onclick=()=>show("tl",bTl); bDoc.onclick=()=>show("doc",bDoc);
  show("info",bInfo);

  const editBtn=el("button","btn ghost","✏️ แก้ไข"); editBtn.onclick=()=>{ closeModal(); openJobForm(j,false); };
  const delBtn=el("button","btn danger","ลบ"); delBtn.onclick=()=>{
    if(confirm("ลบงานนี้? ไม่สามารถย้อนกลับได้")){ state.jobs=state.jobs.filter(x=>x.id!==id); save(); closeModal(); render(); toast("ลบแล้ว"); }
  };
  m.foot.append(delBtn,editBtn);
}
function paneInfo(j){

  rows.forEach(([k,v])=>{ const f=el("div","field");

  if(j.note){ const f=el("div","field"); f.innerHTML=`<label>หมายเหตุ</label><div>${esc(j.note)}</div>`; d.appendChild(f); }
  if(j.stage<8){
    const adv=el("button","btn accent","▶ เลื่อนไปขั้นถัดไป ("+stageByN(j.stage+1).short+")");
    adv.style.marginTop="6px"; adv.onclick=()=>{ advanceStage(j.id); closeModal(); openJob(j.id); };
    d.appendChild(adv);
  }

function paneTimeline(j){
  const d=el("div","timeline");
  STAGES.forEach(s=>{
    const step=el("div","tl-step");
    const hist=(j.history||[]).find(h=>h.stage===s.n);
    if(s.n<j.stage) step.classList.add("done");
    else if(s.n===j.stage) step.classList.add("current");
    const dot=el("div","tl-dot", s.n<j.stage?"✓":String(s.n)); step.appendChild(dot);
    const body=el("div","tl-body");
    body.appendChild(el("div","t",s.label));
    body.appendChild(el("div","d", hist?("✅ "+fmtDate(hist.at)):(s.n===j.stage?"⏳ ขั้นปัจจุบัน":"ยังไม่ถึง")));
    if(hist&&hist.note&&hist.note!=="สร้างงาน") body.appendChild(el("div","note",hist.note));
    step.appendChild(body); d.appendChild(step);
  });
  return d;
}

  {key:"receipt",   t:"ใบเสร็จรับเงิน", s:"Receipt", ic:"🧾", prefix:"RC"},
];
function paneDocs(j,m){
  const d=el("div");

}

// ---- Thai baht text (จำนวนเงินเป็นตัวอักษร) ----
function readInt(n, hasHigher){
  n = parseInt(n,10);
  if(isNaN(n)||n===0) return "";
  if(n>=1000000) return readInt(Math.floor(n/1000000),false)+"ล้าน"+readInt(n%1000000,true);
  const digits=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"];
  const places=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  const s=String(n), len=s.length; let r="";
  for(let i=0;i<len;i++){
    const d=Number(s[i]), pos=len-1-i;
    if(d===0) continue;
    if(pos===0 && d===1 && (len>1||hasHigher)) r+="เอ็ด";
    else if(pos===1 && d===1) r+="สิบ";
    else if(pos===1 && d===2) r+="ยี่สิบ";
    else r+=digits[d]+places[pos];
  }
  return r;
}
function bahtText(amount){
  amount = Number(amount)||0;
  const neg = amount<0; amount=Math.abs(amount);
  const fixed = amount.toFixed(2);
  const [ip, dp] = fixed.split(".");
  const bahtStr = readInt(ip,false);
  const satang = parseInt(dp,10);
  let out = "";
  if(bahtStr) out = bahtStr + "บาท";
  if(satang===0){ out = (bahtStr?out:"ศูนย์บาท") + "ถ้วน"; }
  else { out = (bahtStr?out:"") + readInt(dp,false) + "สตางค์"; }
  return (neg?"ลบ":"") + out;
}

      </div>
      <div class="doc-title-box">

      </div>
    </div>
    <div class="doc-cust">
      <div><div class="lbl">ลูกค้า / ผู้ว่าจ้าง (Owner)</div><div class="val">${esc(j.owner)||"-"}</div></div>
      <div style="text-align:right"><div class="lbl">งาน / สถานที่</div><div class="val">${esc(j.title)||"-"}${j.location?(" · "+esc(j.location)):""}</div></div>
    </div>
    <table class="dp-items"><thead><tr>
      <th style="width:34px">#</th><th>รายละเอียด</th><th style="width:50px">จำนวน</th>
      <th style="width:50px">หน่วย</th><th style="width:90px">ราคา/หน่วย</th><th style="width:100px">จำนวนเงิน</th>
    </tr></thead><tbody>${itemsRows}${pad}</tbody></table>
    <div class="dp-foot">
      <div class="dp-baht"><div class="lbl">จำนวนเงิน (ตัวอักษร)</div><b>(${bahtText(t.grand)})</b>
        ${doc.note?`<div class="dp-note">หมายเหตุ: ${esc(doc.note)}</div>`:""}${paidLine}
      </div>
      <div class="dp-tot">
        <div class="row"><span>รวมเป็นเงิน</span><span>${money(t.sub)}</span></div>
        <div class="row"><span>ภาษีมูลค่าเพิ่ม 7%</span><span>${money(t.vat)}</span></div>
        ${t.wht>0?`<div class="row"><span>หัก ณ ที่จ่าย ${esc(doc.wht)}%</span><span>-${money(t.wht)}</span></div>`:""}
        <div class="row grand"><span>ยอดสุทธิ</span><span>${money(t.grand)}</span></div>
      </div>
    </div>
    <div class="dp-sign">
      <div class="box">${sigImg}<div class="line"></div><div class="cap">${s1[0]}<br>${s1[1]}<br>วันที่ ........./........./.........</div></div>
      <div class="box"><div class="line"></div><div class="cap">${s2[0]}<br>${s2[1]}<br>วันที่ ........./........./.........</div></div>
    </div>
  </div></div>`;
}
function printDoc(j, dt, doc){
  const copies = dt.key==="billing" ? ["ต้นฉบับ","สำเนา"] : [null];
  let pa=document.getElementById("printArea");
  if(!pa){ pa=document.createElement("div"); pa.id="printArea"; document.body.appendChild(pa); }
  pa.innerHTML = copies.map(cp=>docPageHtml(j,dt,doc,cp)).join("");
  document.title = dt.t+" "+doc.no;
  window.print();
  setTimeout(()=>{ document.title="ระบบติดตามเอกสารงานเขียนแบบ · Otteri"; },800);
}
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAo0ydbqUPr5WTEdTk5ZVMLS4vUyl8qr18",
    authDomain: "otteri-drawing-tracker.firebaseapp.com",
    projectId: "otteri-drawing-tracker",
    storageBucket: "otteri-drawing-tracker.firebasestorage.app",
    messagingSenderId: "448958156204",
    appId: "1:448958156204:web:2671ad75b6ab0130e33e09"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const ref = doc(db, "tracker", "shared");

  let ready = false, pending = null, timer = null;
  function flush(){
    if(!pending) return;
    const data = pending; pending = null;
    setDoc(ref, data, { merge:true }).catch(e => console.warn("[cloud] save failed", e));
  }
  // Called by the app's save(): queue the shared state, write debounced.
  window.__otteriCloudSave = (shared) => {
    pending = shared;
    if(!ready) return;              // flushes once auth is ready
    clearTimeout(timer); timer = setTimeout(flush, 500);
  };

  signInAnonymously(auth).catch(e => console.error("[cloud] auth failed", e));
  onAuthStateChanged(auth, (user) => {
    if(!user) return;
    ready = true;
    onSnapshot(ref,
      (snap) => { if(window.__otteriApplyRemote) window.__otteriApplyRemote(snap.exists() ? snap.data() : null); },
      (err)  => { console.warn("[cloud] snapshot error", err); }
    );
    if(pending) flush();
  });
</script>
